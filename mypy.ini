# Mypy configuration — controlled baseline.
#
# STRATEGY (decision for v1.0.1, see docs/LEGACY_MYPY_ERRORS.md):
#  - New and PR-modified files must be 0-error clean.
#  - Legacy modules carry pre-existing errors (baseline = 69 errors in 16 files).
#  - Per-module baseline below silences ONLY the specific error codes that were
#    present at baseline (commit 68c8f32 + release work). This is NOT
#    `ignore_errors = true` for the whole codebase.
#  - The CI mypy gate fails if a new error appears in a new/modified file or if
#    the legacy baseline grows.

[mypy]
python_version = 3.11
plugins =
warn_unused_configs = True
ignore_missing_imports = True
# Do NOT use ignore_errors globally. Baseline is enforced per-module below.

# ---------------------------------------------------------------------------
# Legacy per-module baseline (v1.0.1). Do NOT add new modules here without a
# review. New/changed files must NOT be listed here.
# ---------------------------------------------------------------------------

[mypy-calendar_planner.app.mcp_transport]
disable_error_code = arg-type, assignment

[mypy-calendar_planner.app.stdio_mcp_transport]
disable_error_code = union-attr

[mypy-calendar_planner.calendar.creator]
disable_error_code = dict-item

[mypy-calendar_planner.calendar.mcp_gateway]
disable_error_code = var-annotated

[mypy-calendar_planner.cli]
disable_error_code = union-attr

[mypy-calendar_planner.domain.validation]
disable_error_code = operator

[mypy-calendar_planner.extraction.audit]
disable_error_code = attr-defined

[mypy-calendar_planner.extraction.structured]
disable_error_code = assignment, index

[mypy-calendar_planner.source.adapters.file_adapters]
disable_error_code = arg-type

[mypy-calendar_planner.source.registry]
disable_error_code = attr-defined

[mypy-calendar_planner.ui.event_editor]
disable_error_code = misc

[mypy-calendar_planner.ui.main_window]
disable_error_code = misc, attr-defined, call-overload, arg-type

[mypy-calendar_planner.ui.stages.stage3_comparison]
disable_error_code = union-attr

[mypy-calendar_planner.ui.stages.stage4_participants]
disable_error_code = misc, valid-type, call-overload, arg-type

[mypy-calendar_planner.ui.stages.stage5_enrichment]
disable_error_code = misc, valid-type, call-overload, arg-type

[mypy-calendar_planner.ui.stages.stage6_creation]
disable_error_code = misc, assignment, union-attr