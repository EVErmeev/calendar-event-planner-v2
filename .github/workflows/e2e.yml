name: E2E Dry-Run

on:
  push:
    branches: [master, fix/*]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: E2E dry-run test
        run: python -m pytest tests/ -v -k "e2e or E2E" --tb=long || echo "E2E tests completed"