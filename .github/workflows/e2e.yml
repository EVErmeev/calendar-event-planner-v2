name: E2E Dry-Run

on:
  push:
    branches: [master, fix/*]
  pull_request:
    branches: [master]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements.txt pytest openpyxl
      - name: Control scenario E2E
        run: python -m pytest tests/test_control_scenario.py -v --tb=long
      - name: E2E pipeline
        run: python -m pytest tests/test_e2e.py -v --tb=long