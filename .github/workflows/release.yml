name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag points to master
        shell: powershell
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          $head = git rev-parse HEAD
          $master = git rev-parse origin/master 2>$null
          if ($master -and $head -ne $master) {
            Write-Error "Tag $tag does not point to master (head=$head master=$master)"
            exit 1
          }
          Write-Host "Tag points to master: OK"

      - name: Version consistency
        shell: powershell
        run: |
          python -c "import calendar_planner; print(calendar_planner.__version__)"
          python -c "import importlib.metadata as m; print(m.version('calendar-event-planner-v2'))"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest tests/ -q --ignore=tests/test_gui_background_analysis.py

      - name: Ruff
        run: |
          pip install ruff
          ruff check calendar_planner/ tests/ scripts/

      - name: Mypy gate
        run: |
          pip install mypy
          python scripts/mypy_gate.py

      - name: Build portable
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build_portable.ps1

      - name: Build installer
        shell: powershell
        run: |
          choco install innosetup -y
          Expand-Archive dist/CalendarEventPlanner-portable-v1.1.0.zip build/installer_stage -Force
          powershell -ExecutionPolicy Bypass -File scripts/build_installer.ps1 -Version 1.1.0 -StagingDir build/installer_stage

      - name: Verify distribution
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/verify_distribution.ps1 -ZipPath dist/CalendarEventPlanner-portable-v1.1.0.zip

      - name: Clean install smoke
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/smoke_clean_windows.ps1 -ZipPath dist/CalendarEventPlanner-portable-v1.1.0.zip

      - name: Compute SHA256SUMS.txt
        shell: powershell
        run: |
          Get-ChildItem dist/CalendarEventPlanner-* | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Add-Content dist/SHA256SUMS.txt "$h  $($_.Name)"
          }
          Get-ChildItem dist/CalendarEventPlanner-Setup-*.exe.sha256 | ForEach-Object { Add-Content dist/SHA256SUMS.txt (Get-Content $_.FullName) }

      - name: Secrets scan
        shell: powershell
        run: |
          $bad = Get-ChildItem dist -Recurse -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^\.env$|\.venv|credential|token|__pycache__' }
          if ($bad) { Write-Error "Secrets/artifacts found in dist: $($bad.Name -join ',')"; exit 1 }
          Write-Host "Secrets scan OK"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          gh release create "$tag" `
            dist/CalendarEventPlanner-Setup-v1.1.0.exe `
            dist/CalendarEventPlanner-Setup-v1.1.0.exe.sha256 `
            dist/CalendarEventPlanner-portable-v1.1.0.zip `
            dist/CalendarEventPlanner-portable-v1.1.0.zip.sha256 `
            dist/component-manifest.json `
            dist/SHA256SUMS.txt `
            --title "Calendar Event Planner v1.1.0" `
            --generate-notes || exit 1