name: CI

on:
  push:
    branches: [master, fix/*]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov coverage

      - name: Test package install
        run: |
          pip install -e .
          calendar-planner --help

      - name: Run tests with coverage
        run: |
          xvfb-run -a python -m pytest tests/ -v --cov=calendar_planner --cov-report=xml --cov-report=json:coverage.json --cov-report=term-missing --cov-fail-under=75

      - name: Check per-module coverage thresholds
        run: python scripts/check_coverage_thresholds.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check calendar_planner/ tests/

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install mypy
      - name: Mypy controlled baseline gate
        run: python scripts/mypy_gate.py

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: BAT help from clean checkout
        shell: cmd
        run: call run_calendar_planner.bat --help

      - name: Check venv was created
        shell: cmd
        run: |
          if not exist ".venv\Scripts\python.exe" exit /b 1

      - name: BAT version
        shell: cmd
        run: call run_calendar_planner.bat --version

      - name: BAT GUI startup smoke
        shell: cmd
        run: call run_calendar_planner.bat --smoke-gui

      - name: BAT startup with stdio MCP
        shell: cmd
        run: call run_calendar_planner.bat --smoke-startup-mcp