name: Installer CI

on:
  push:
    branches: [feature/v1.1.0-windows-installer, master]
  pull_request:
    branches: [master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Test package install
        run: calendar-planner --help
      - name: Unit tests
        run: python -m pytest tests/ -q --ignore=tests/test_gui_background_analysis.py
      - name: Bundled MCP + runtime config + diagnostics + first-run + updates
        run: python -m pytest tests/test_bundled_mcp.py tests/test_runtime_config_manifest.py tests/test_diagnostics.py tests/test_first_run.py tests/test_updates.py tests/test_version_consistency.py -q

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint
        run: |
          pip install ruff
          ruff check calendar_planner/ tests/ scripts/

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Mypy gate
        run: |
          pip install -e ".[dev]"
          pip install mypy
          python scripts/mypy_gate.py

  exchange-mcp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: MCP tests
        run: |
          pip install pytest
          python -m pytest tests/test_bundled_mcp.py -q
      - name: Bundle build (files present + fix)
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_exchange_mcp_bundle.ps1 -Version 1.0.0-cep.1

  distribution-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build portable + verify
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_portable.ps1 -Version 1.1.0
          powershell -ExecutionPolicy Bypass -File scripts/verify_distribution.ps1 -ZipPath dist/CalendarEventPlanner-portable-v1.1.0.zip
      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: portable
          path: |
            dist/CalendarEventPlanner-portable-v1.1.0.zip
            dist/CalendarEventPlanner-portable-v1.1.0.zip.sha256

  installer-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y
      - name: Prepare staging
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_portable.ps1 -Version 1.1.0
          Expand-Archive dist/CalendarEventPlanner-portable-v1.1.0.zip build/installer_stage -Force
      - name: Build installer
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_installer.ps1 -Version 1.1.0 -StagingDir build/installer_stage
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            dist/CalendarEventPlanner-Setup-v1.1.0.exe
            dist/CalendarEventPlanner-Setup-v1.1.0.exe.sha256

  clean-install-smoke:
    runs-on: windows-latest
    needs: distribution-verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build portable
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build_portable.ps1 -Version 1.1.0
      - name: Clean install smoke
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/smoke_clean_windows.ps1 -ZipPath dist/CalendarEventPlanner-portable-v1.1.0.zip