[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calendar-event-planner-v2"
version = "1.0.0"
description = "Автоматическое формирование календарных событий по произвольному источнику"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "PyPDF2>=3.0.0",
    "python-pptx>=0.6.23",
    "beautifulsoup4>=4.12.0",
    "python-dateutil>=2.8.0",
    "fuzzywuzzy>=0.18.0",
    "python-Levenshtein>=0.25.0",
    "tzdata>=2024.1",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.2.0",
    "coverage>=7.4.0",
]

[project.scripts]
calendar-planner = "calendar_planner.app.bootstrap:main"

[tool.coverage.run]
omit = [
    "calendar_planner/ui/*",
    "calendar_planner/cli/*",
    "calendar_planner/app/bootstrap.py",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff.lint]
ignore = [
    "BLE001",  # blind except — намеренно для graceful degradation
    "DTZ011",  # date.today — допустимо для date-only операций
    "DTZ007",  # strptime без timezone — допустимо для ISO-парсинга
    "FURB162", # fromisoformat-replace-z — стилистическая рекомендация
    "FLY002",  # static-join-to-f-string — стилистическая рекомендация
    "F841",    # unused-variable — допустимо в тестах для читаемости
    "F823",    # undefined-local — допустимо в callback scope
    "G201",    # logging-exc-info — стилистическая рекомендация
    "PERF102", # incorrect-dict-iterator — стилистическая рекомендация
]